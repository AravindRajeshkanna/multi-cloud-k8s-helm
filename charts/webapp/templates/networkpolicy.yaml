{{- if .Values.networkPolicy.enabled }}
# What the application accepts. Everything else is closed by the namespace's
# default-deny policy (policies/namespace/network.yaml), which also allows DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "webapp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The ingress controller.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        {{- if .Values.metrics.serviceMonitor.enabled }}
        # Prometheus, which scrapes /metrics.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
        {{- end }}
        {{- if .Values.test.enabled }}
        # The helm test pod, in this namespace.
        - podSelector:
            matchLabels:
              {{- include "webapp.testSelectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- if .Values.test.enabled }}
---
# The helm test pod may reach the application and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webapp.fullname" . }}-test
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "webapp.testSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "webapp.selectorLabels" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- end }}
