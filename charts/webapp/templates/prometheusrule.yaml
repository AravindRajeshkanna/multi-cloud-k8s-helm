{{- if .Values.metrics.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
    {{- with .Values.metrics.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "webapp.fullname" . }}
      rules:
        - alert: WebappTargetDown
          expr: up{namespace="{{ .Release.Namespace }}", service="{{ include "webapp.fullname" . }}"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ include "webapp.fullname" . }} in {{ .Release.Namespace }} cannot be scraped"
        - alert: WebappHighErrorRate
          expr: |
            100 * sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", service="{{ include "webapp.fullname" . }}", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", service="{{ include "webapp.fullname" . }}"}[5m]))
              > {{ .Values.metrics.rules.errorRatePercent }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ include "webapp.fullname" . }} in {{ .Release.Namespace }} is answering more than {{ .Values.metrics.rules.errorRatePercent }}% of requests with a 5xx"
        - alert: WebappPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", pod=~"{{ include "webapp.fullname" . }}-.*"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ include "webapp.fullname" . }} in {{ .Release.Namespace }} is restarting repeatedly"
{{- end }}
