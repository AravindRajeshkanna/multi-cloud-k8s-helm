# Production: autoscaled, protected from disruptions, public HTTPS.
# Rendering needs a host: --set ingress.host=<name for this cloud>

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# With at least 3 replicas, two stay up while a node drains.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Needs a real domain pointing at the ingress controller, and the
# letsencrypt-prod issuer from charts/cluster-issuers (docs/charts.md).
ingress:
  enabled: true
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 192Mi
