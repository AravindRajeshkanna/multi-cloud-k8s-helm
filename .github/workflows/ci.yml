name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra

  terraform-validate:
    name: terraform validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [aws-eks, azure-aks, gcp-gke]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - name: Init (no backend, no credentials)
        run: terraform -chdir=infra/${{ matrix.dir }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra/${{ matrix.dir }} validate

  scripts:
    name: shellcheck and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh
      - name: Offline tests for cluster-ops.sh (cloud CLIs stubbed)
        run: scripts/test-cluster-ops.sh
      - name: Offline tests for deploy.sh (helm, kubectl and curl stubbed)
        run: scripts/test-deploy.sh
      - name: Offline tests for scan-summary.sh (hand-made vulnerability reports)
        run: scripts/test-scan-summary.sh

  charts:
    name: helm charts (lint, render, assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version-file: .tool-versions
      - name: Lint and render every cloud x environment, assert on the manifests
        run: scripts/test-charts.sh

  charts-kind:
    name: helm charts (install on a throwaway kind cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version-file: .tool-versions
      - name: Create a throwaway cluster
        run: |
          kind version
          kind create cluster --name charts --wait 180s
          kubectl --context kind-charts version
      - name: Install and test the charts
        run: KUBE_CONTEXT=kind-charts scripts/test-charts-kind.sh
      - name: Test the admission policies
        run: KUBE_CONTEXT=kind-charts scripts/test-policies-kind.sh
      - name: Show cluster state after a failure
        if: failure()
        run: |
          kubectl --context kind-charts get pods -A -o wide || true
          kubectl --context kind-charts get events -A --sort-by=.lastTimestamp | tail -n 60 || true
