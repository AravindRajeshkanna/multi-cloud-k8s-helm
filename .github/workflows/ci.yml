name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra

  terraform-validate:
    name: terraform validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [aws-eks, azure-aks, gcp-gke]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - name: Init (no backend, no credentials)
        run: terraform -chdir=infra/${{ matrix.dir }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra/${{ matrix.dir }} validate

  scripts:
    name: shellcheck and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh
      - name: Offline tests for cluster-ops.sh (cloud CLIs stubbed)
        run: scripts/test-cluster-ops.sh
      - name: Offline tests for deploy.sh (helm, kubectl and curl stubbed)
        run: scripts/test-deploy.sh
      - name: Offline tests for scan-summary.sh (hand-made vulnerability reports)
        run: scripts/test-scan-summary.sh

  charts:
    name: helm charts (lint, render, assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version-file: .tool-versions
      - name: Lint and render every cloud x environment, assert on the manifests
        run: scripts/test-charts.sh

  # The charts, policies and network rules on a real API server. Run once with
  # kind's default network plugin (which ignores NetworkPolicy) and once with
  # Cilium (which enforces it, as AKS and GKE do), so the same tests prove the
  # rules are accepted everywhere and enforced where they can be.
  charts-kind:
    name: kind cluster (${{ matrix.cni }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cni: kindnet
            network_policy: ignored
          - cni: cilium
            network_policy: enforced
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version-file: .tool-versions
      - name: Create a throwaway cluster
        run: |
          kind version
          scripts/kind-cluster.sh charts ${{ matrix.cni }}
          kubectl --context kind-charts version
      - name: Install and test the charts
        run: KUBE_CONTEXT=kind-charts scripts/test-charts-kind.sh
      - name: Test the admission policies and namespace limits
        run: KUBE_CONTEXT=kind-charts scripts/test-policies-kind.sh
      - name: Test the network rules
        run: KUBE_CONTEXT=kind-charts NETWORK_POLICY=${{ matrix.network_policy }} scripts/test-network-kind.sh
      - name: Show cluster state after a failure
        if: failure()
        run: |
          kubectl --context kind-charts get pods -A -o wide || true
          kubectl --context kind-charts get events -A --sort-by=.lastTimestamp | tail -n 60 || true

  # The optional Prometheus and Grafana stack, from the values file Terraform uses,
  # on the policy-enforcing cluster so Prometheus has to get through the app's
  # network policy.
  monitoring-kind:
    name: monitoring stack (kind, cilium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version-file: .tool-versions
      - name: Create a throwaway cluster
        run: scripts/kind-cluster.sh monitoring cilium
      - name: Install the stack and check what it scrapes
        run: KUBE_CONTEXT=kind-monitoring scripts/test-monitoring-kind.sh
      - name: Show cluster state after a failure
        if: failure()
        run: |
          kubectl --context kind-monitoring get pods -A -o wide || true
          kubectl --context kind-monitoring get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          # The logs of any container that has restarted, including the run before the last crash.
          for pod in $(kubectl --context kind-monitoring get pods -A --no-headers | awk '$5 != "0" && $5 != "" {print $1"/"$2}'); do
            echo "===== $pod (previous run)"
            kubectl --context kind-monitoring -n "${pod%%/*}" logs "${pod##*/}" --all-containers --previous --tail=40 2>&1 || true
          done
